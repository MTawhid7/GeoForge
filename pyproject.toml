[project]
name = "geoforge"
version = "0.1.0"
description = "Generator of validated, well-posed geometry puzzles with human-readable solutions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Hard pins, deliberately. docs/07 P1a: a pin is what isolates us from upstream churn.
# Versions match the environment verified in Phase 0 (spikes/p0/REPORT.md).
dependencies = [
    "newclid==3.0.1",
    "py-yuclid==3.0.0",  # C++ backend: primary per docs/03 §3.2
    "pyyaml==6.0.3",     # BUG-0: newclid 3.0.1's wheel metadata omits this but imports it
    "numpy==2.5.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoforge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Mirrors upstream Newclid function bodies with a single line changed, so it stays diffable
# against the original and easy to drop when upstream fixes the defect. Upstream's idioms are
# preserved deliberately. Scoped to this file only; behaviour is covered by regression tests.
"src/geoforge/solvers/_patches.py" = ["UP035", "SIM201", "E501", "B905"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/geoforge"]
# Reference engines ship without type stubs; we type our side of the boundary (the SAL)
# and treat engine internals as untyped. docs/03 §3.3.
[[tool.mypy.overrides]]
module = ["newclid.*", "py_yuclid.*", "sympy.*"]
ignore_missing_imports = true

# sympy 1.14 ships no py.typed, so `ignore_missing_imports` alone leaves the top-level module as
# `types.ModuleType` and every `sympy.sqrt` reads as a missing attribute under --strict. Following
# the untyped source gives real signatures instead of silencing the checker with per-call ignores,
# which matters because the area layer (docs/10) is correctness-path code.
#
# Scoped to sympy alone, deliberately: applying it to newclid as well makes mypy analyse the
# engine's source and surface upstream export errors inside `_patches.py`, which is exactly the
# churn the hard pin exists to keep out (docs/07 P1a).
[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true
follow_untyped_imports = true

# Same rationale as the ruff per-file-ignore above: this module mirrors upstream bodies over
# untyped sympy internals and rebinds module attributes by design. Kept verbatim rather than
# re-typed so it stays diffable against upstream.
[[tool.mypy.overrides]]
module = ["geoforge.solvers._patches"]
disallow_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["name-defined", "attr-defined", "no-any-return", "misc"]

# The area layer computes with sympy, which ships no type information, so every call into it is
# an untyped call returning Any. Exactly two checks are relaxed and only for this module —
# everything else --strict enforces (untyped defs, missing annotations, unreachable code) stays
# on, because this is correctness-path code (CLAUDE.md). The alternative was a `# type: ignore`
# on ~20 individual sympy calls, which would hide real errors as well as these.
[[tool.mypy.overrides]]
module = ["geoforge.generator.area"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
